controller_manager:
  ros__parameters:
    update_rate: 50

    # Publish the position and velocity interfaces exposed by ros2_control.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
# --- Controller Specific Parameters ---
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
    joints:
      - left_back_wheel_joint
      - left_front_wheel_joint
      - right_back_wheel_joint
      - right_front_wheel_joint
      - boom_arm_to_base_link_joint
      - gimbal_to_base_joint
      - bucket_to_boom_arm_joint
    interfaces:
      - position
      - velocity
diff_drive_controller:
  ros__parameters:
    left_wheel_names: [left_back_wheel_joint, left_front_wheel_joint]
    right_wheel_names: [right_back_wheel_joint, right_front_wheel_joint]
    wheel_separation: 0.44
    wheel_radius: 0.1
    
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    enable_odom_tf: True

    use_stamped_vel: false
